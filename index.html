 if(r.ok){baseRaw=r.raw;data.rev=r.rev;storageOk=true;return true}

/* Three kinds of comment, kept apart: what is right, what is right but needs precision, and what is wrong.
   Criticisms show the learner's own words they refer to; nothing here is a mastery verdict. */
function renderFeedback(h,f,concepts,ctx,text=ctx?.draft.text){const box=E('div','feedback');box.dataset.schema=String(f.schema);h.append(E('div','new',f.summary));
 const q=s=>{const v=L.verbatimQuote(s,text);return v?`“${v}” — `:''};
 // One focused follow-up question by default: every point stays visible, but only the most important one carries its
 // question and reply box (a misconception first, then precision, then a missing condition). The rest wait behind an
 // explicit "다른 질문도 보기"; an item the learner already answered always keeps its question and thread. Nothing stored changes.
 const items=[...f.misconceptions.map((x,i)=>['misconceptions',i]),...f.precision.map((x,i)=>['precision',i]),...f.missing.map((x,i)=>['missing',i])];
 const answered=(type,i)=>!!ctx&&T.stream(ctx.l,T.itemRef(ctx.l,ctx.draft,type,i)).length>0;
 const moreKey=ctx?`${ctx.l.id}|fbmore|${ctx.draft.at}`:null;let moreLocal=false;
 const fill=()=>{box.replaceChildren();const more=moreKey?tutorOpen.has(moreKey):moreLocal,primary=items[0]?.join(':');
  const asks=(type,i)=>more||`${type}:${i}`===primary||answered(type,i);
  // With a lesson context, a shown question gets a real reply box (an AI conversation scoped to that item).
  const reply=(type,i)=>{if(ctx)feedbackReplies(box,ctx.l,ctx.draft,type,i,'이 질문에 답하기')};
  for(const x of f.correct)box.append(E('p','hint fb-correct','✓ '+q(x.quote)+x.point));
  // A question or guess the coach had called a misconception is listed as a point to refine (x.reclassified stays in the record).
  const point=(type,i,cls,text,question)=>{const on=asks(type,i),el=E('p','hint '+cls,text+(on?' — '+question:''));el.dataset.fb=`${type}:${i}`;box.append(el);if(on)reply(type,i)};
  f.precision.forEach((x,i)=>point('precision',i,'fb-precision','더 정확하게: '+q(x.quote)+x.issue+' 왜: '+x.why,x.question));
  f.misconceptions.forEach((x,i)=>point('misconceptions',i,'fb-misconception','다시 생각하기: '+q(x.quote)+x.issue+(x.why?' 왜: '+x.why:''),x.question));
  f.missing.forEach((x,i)=>point('missing',i,'fb-missing','빠진 조건: '+x.issue,x.question));
  const hidden=items.filter(([t,i])=>!asks(t,i)).length;
  // Keyboard focus moves to the first newly shown question's reply button, so the learner is not dropped to the page top.
  if(hidden){const first=items.find(([t,i])=>!asks(t,i)).join(':');const b=button(`다른 질문도 보기 (${hidden})`,()=>{if(moreKey)tutorOpen.add(moreKey);else moreLocal=true;fill();
   const el=box.querySelector(`[data-fb="${first}"]`);const to=el?.nextElementSibling?.querySelector('button')||el;if(to){if(to===el)el.tabIndex=-1;to.focus()}},'small-action fb-more');box.append(b)}
  if(f.schema===2&&f.explained.length){const names=new Map(concepts.map(c=>[c.id,c.name]));const evidence=E('div','hint fb-explained');
   evidence.append(E('strong','','AI가 내 설명과 연결한 개념'),E('p','','AI의 연결 의견이에요. 이해를 확인한 시험 결과는 아니에요.'));
   const quotes=E('ul','');for(const e of f.explained)quotes.append(E('li','',`${names.get(e.id)||e.id} — “${L.verbatimQuote(e.quote,text)}”`));
   evidence.append(quotes);box.append(evidence)}
  if(f.uncertainty)box.append(E('p','hint fb-uncertainty','AI가 판단하지 못한 점: '+f.uncertainty));
  box.append(E('p','tiny fb-provenance',(f.schema===2?'AI 피드백':'이전 버전 AI 피드백')+(f.reviewer?.model?' · '+f.reviewer.model:'')+' · 참고 의견이에요'));

  if(ctx)unplacedReplies(box,ctx.l,ctx.draft)};
 fill();h.append(box)}

/* Feedback (D2/D5): only the fields the coach needs are sent; the response is schema-checked before it is

 const find=()=>{const cur=data.lessons.find(x=>x.id===id);return cur?[cur,cur.drafts.find(x=>x.at===draft.at&&x.text===draft.text)]:[]};
 try{const r=await api('feedback',{lesson:L.feedbackPayload(l.lesson),context:L.learningContext(l),text:draft.text,profile:P.aiPayload(latestProfile())},ctl.signal);
  const f=L.validateFeedback({...r.data,reviewer:{provider:r.provider,model:r.model,at:Date.now()}},l.lesson.concepts.map(c=>c.id),draft.text);if(inflight.get(key)!==ctl)return;const [cur,dr]=find();if(!dr||!canWrite())return;
  const stamped=L.stampFeedback(f);dr.feedback=stamped;delete dr.feedbackError;cur.feedback=stamped;cur.feedbackFor=dr.at;track(cur,'AI 피드백 받음')}

function done(m,l){const d=l.lesson,c=stagePanel(m,l,5,{sub:'이해를 다 끝냈다는 판정은 아니에요. 오늘 질문하고, 예상하고, 설명한 기록이 남았어요.'});const stats=E('div');[[String(l.scenarios.length),'생각 실험'],[String(l.drafts.length),'나의 설명'],[String(d.concepts.length),'만난 개념']].forEach(([n,t])=>{const b=E('div','stat');b.append(E('strong','',n),E('span','',t));stats.append(b)});c.append(stats);const idn=C.identity(l),teaser=E('div','constellation-teaser');teaser.append(E('h3','',idn.short));const go=button('별자리 보기',()=>openAtlas(l),'atlas-launch');go.setAttribute('aria-label',`${idn.short} 별자리 보기`);teaser.append(go);c.append(teaser);c.append(E('hr','divider'),E('h3','','나의 배움 경로'),E('p','sub',idn.question?'처음 궁금했던 것: '+idn.question:'수업 자료에서 시작: '+(idn.file?.name||idn.title)));if(l.prediction)c.append(E('div','old','처음의 내 예상: '+l.prediction));if(l.reflection)c.append(E('div','old','예상과 비교한 내 생각: '+l.reflection));explanationRounds(c,l);boundarySummary(c,l);notionBlock(c,l);const row=E('div','actions');row.append(button('다음 탐험 시작하기 →',()=>{data.active=null;persist();render()}),button('내 설명 다시 보기',()=>setStage(l,4),'btn secondary'));c.append(row)}
/* Growth stage: each explanation together with what the record links to it — its AI feedback, the AI's own rewrite (a
   step shown only when the AI actually wrote one; never made from the feedback, tutor replies or the learner's text),
   the conversation that followed, and the learner's next explanation. The same links as the archive (journey.js chain()). The learner's text is shown exactly, a long text as a
   preview with the full text one click away; AI parts are labelled; nothing here is a verdict. */
function explanationRounds(c,l){const rounds=CuriJourney.chain(l);if(!rounds.length)return;
 const sec=E('section','xr');sec.id='explanationRounds';const h=E('h3','','내 설명과 AI 피드백');h.id='xrTitle';sec.setAttribute('aria-labelledby','xrTitle');
 sec.append(h,E('p','hint','설명마다 AI 피드백과 이어진 대화를 함께 모았어요. AI가 쓴 부분은 참고 의견이고, 맞는지 확인된 판단이 아니에요.'));
 const at=t=>t===null?'':new Date(t).toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'});
 const LIM=220,body=(t,id)=>{const box=E('div','xr-text');if(t.length>LIM){box.append(E('p','xr-preview',t.slice(0,LIM)+'…'));const d=E('details','xr-full');d.append(E('summary','','전체 보기'));const w=E('p','xr-whole',t);if(id)w.id=id;d.append(w);box.append(d)}else{const w=E('p','xr-whole',t);if(id)w.id=id;box.append(w)}return box};
 const step=(cls,label,tag)=>{const li=E('li','xr-step '+cls),p=E('p','xr-label');p.append(E('span','',label));if(tag)p.append(E('span','xr-tag',tag));li.append(p);return li};
 const STATE={ok:'AI 피드백 있음',error:'AI 피드백을 받지 못함',invalid:'AI 피드백 형식 오류',none:'AI 피드백 없음'};
 rounds.forEach((r,i)=>{const d=E('details','xr-round');d.id='xr-'+r.n;d.open=i===rounds.length-1;
  d.append(E('summary','',[`설명 ${r.n}`,at(r.at),STATE[r.feedback],r.next?'다음 설명 있음':''].filter(Boolean).join(' · ')));const ol=E('ol','xr-steps');
  const mine=step('xr-mine','내가 작성한 설명','내 글');mine.append(body(r.text,`xr-${r.n}-text`));ol.append(mine);
  const fb=step('xr-feedback','AI 피드백',r.feedback==='ok'?['AI',r.model,r.schema===1?'이전 형식':''].filter(Boolean).join(' · '):'');
  if(r.feedback==='ok'){fb.append(E('p','xr-summary',r.summary));
   if(r.items.length){const ul=E('ul','xr-items');for(const y of r.items){const li=E('li','xr-item');li.dataset.kind=y.kind;li.append(E('span','xr-kind',J_KIND[y.kind]+' (AI 분류) '),document.createTextNode((y.quote?`“${y.quote}” — `:'')+y.text+(y.why?' · 왜: '+y.why:'')));ul.append(li)}fb.append(ul)}
   else fb.append(E('p','xr-none','세부 항목 없이 요약만 있어요 (분류 없음).'));
   if(r.uncertainty)fb.append(E('p','xr-none','AI가 판단하지 못한 점: '+r.uncertainty))}
  else fb.append(E('p','xr-none',r.feedback==='error'?'AI 피드백을 받지 못했어요: '+r.error:r.feedback==='invalid'?'저장된 AI 피드백의 형식이 올바르지 않아 표시하지 않았어요. 기록에는 그대로 있어요.':'AI 피드백 없음'));
  ol.append(fb);
  if(r.revision){const rv=step('xr-revision','AI가 제안한 수정 설명','AI가 쓴 글');rv.append(body(r.revision));ol.append(rv)}
  if(r.thread.length){const th=step('xr-thread','피드백에 이어진 대화','');const det=E('details','xr-thread-all');det.append(E('summary','',`대화 ${r.thread.length}개 보기`));
   for(const t of r.thread){det.append(E('p','xr-msg xr-msg-mine',`${t.quick?'버튼: '+t.intent:'내 메시지'+(t.n?' #'+t.n:'')} · ${t.about}에 대해 — ${t.text}`));
    det.append(E('p','xr-msg xr-msg-ai',t.reply?'AI 튜터의 답 (AI): '+t.reply.text:'AI 튜터의 답이 기록되지 않았어요.'))}
   th.append(det);ol.append(th)}
  if(r.next){const nx=step('xr-next','다음에 쓴 설명','내 글');
   // order only: whether the feedback was used is not in the record, so it is not claimed
   if(r.feedback==='ok')nx.append(E('p','xr-none',r.afterFeedback===true?'이 피드백을 받은 뒤에 썼어요. 피드백을 반영했는지는 기록으로 알 수 없어요.':r.afterFeedback===false?'이 피드백이 오기 전에 썼어요.':'이 피드백과의 순서는 기록으로 알 수 없어요.'));
   const go=button(`설명 ${r.next} 보기`,()=>{const t=document.getElementById('xr-'+r.next);if(t){t.open=true;const s=t.querySelector('summary');s.focus();s.scrollIntoView({block:'nearest'})}},'small-action xr-go');nx.append(go);ol.append(nx)}
  d.append(ol);sec.append(d)});
 const lost=CuriJourney.unlinked(l);if(lost.length){const d=E('details','xr-round xr-unlinked');d.id='xrUnlinked';d.append(E('summary','',`어느 설명의 피드백에 대한 대화인지 확인할 수 없어요 (${lost.length}개)`));
  for(const t of lost){d.append(E('p','xr-msg xr-msg-mine',`${t.quick?'버튼: '+t.intent:'내 메시지'+(t.n?' #'+t.n:'')} · ${t.about} — ${t.text}`));d.append(E('p','xr-msg xr-msg-ai',t.reply?'AI 튜터의 답 (AI): '+t.reply.text:'AI 튜터의 답이 기록되지 않았어요.'))}sec.append(d)}
 c.append(sec)}
const J_KIND=CuriJourney.KIND;

function journal(l){const jb=$('#exportJourney');if(jb)jb.hidden=!l||l.stage===5; // the completion screen has its own (notion-ui.js)
 const root=$('#journal');root.replaceChildren();$('#journalAll')?.remove();if(!l){root.append(E('li','','첫 질문을 남기면 시작돼요.'));return}
 // Condensed view: repeated activity in a row becomes one line ("AI 튜터에게 물어봄 ×4"); the five most recent lines show,
 // and the full, unmodified history stays one click away. The record itself is never changed.
 const ev=eventsOf(l),runs=[];for(const x of ev){const last=runs.at(-1);if(last&&last.what===x.what){last.n++;last.at=x.at}else runs.push({what:x.what,at:x.at,n:1})}
 const line=r=>E('li','',`${new Date(r.at).toLocaleDateString('ko-KR')} · ${r.what}${r.n>1?` ×${r.n}`:''}`);
 runs.slice().reverse().slice(0,5).forEach(r=>root.append(line(r)));
 if(ev.length>5){const d=E('details','journal-all');d.id='journalAll';d.append(E('summary','',`전체 기록 ${ev.length}개`));const ol=E('ol','journal journal-full');
  d.addEventListener('toggle',()=>{if(d.open&&!ol.childElementCount)ev.slice().reverse().forEach(x=>ol.append(E('li','',`${new Date(x.at).toLocaleString('ko-KR')} · ${x.what}`)))},{});d.append(ol);root.after(d)}}
function setStatus(text,online){const b=$('#status'),dot=E('span','status-dot',text.slice(0,1)),t=E('span','status-text',text.slice(2));dot.setAttribute('aria-hidden','true');b.replaceChildren(dot,document.createTextNode(' '),t);b.classList.toggle('online',!!online);b.setAttribute('aria-label',text.slice(2)+' — AI 연결 설정 열기')}

async function importBackup(file){if(!canWrite())throw Error('이 탭은 읽기 전용이에요. 학습 중인 탭에서 가져오거나 ‘이 탭에서 계속하기’를 눌러 주세요.');const v=JSON.parse(await file.text());if(v.format!=='curiven-v01'||!Array.isArray(v.lessons))throw Error('CURIVEN 백업 파일이 아닙니다');

 const note=plan.action==='restore'?'\n\n파일에 저장된 개인 프로필도 함께 복원돼요.':plan.action==='overwrite'?'\n\n파일에 다른 개인 프로필이 있어요. 다음 단계에서 교체 여부를 따로 물어볼게요.':'\n\n현재 개인 프로필은 그대로 유지돼요.';
 if(!confirm('현재 학습 기록을 가져온 파일로 교체할까요?'+note))return;

 if(plan.action==='overwrite'&&confirm(`현재 프로필을 파일의 프로필로 바꿀까요?\n\n현재: ${P.summary(profile)}\n파일: ${P.summary(plan.incoming)}\n\n[취소]를 누르면 현재 프로필을 유지하고 학습 기록만 가져와요.`))nextProfile=plan.incoming;
 abortAll();data={lessons:v.lessons,active:v.active??null};persist();if(nextProfile)saveProfile(nextProfile,{keepTime:true});closeSettings(true);render();return true}
/* Changes made by other tabs (D1/D8). Read-only tabs mirror them. A writing tab should never see its
   records change underneath it; if it does, it stops writing (conflict) instead of overwriting.
   Profile changes are applied without re-rendering an open form, so unsaved input is never replaced. */
addEventListener('storage',e=>{if(e.storageArea!==store())return;

 if(e.key===P.PROFILE_KEY||e.key===null){const r=P.readProfile(store());if(r.status!=='ok')return;const changed=!profile||!P.sameProfile(profile,r.profile)||profile.updatedAt!==r.profile.updatedAt;profile=r.profile;if(!changed)return;
  if(!canWrite()){if(access!=='conflict')render()}else if(settingsIsOpen()&&settingsTab==='profile'){const s=$('#profileStatus');if(s){s.className='msg';s.textContent='다른 탭에서 프로필이 바뀌었어요. 지금 입력한 내용은 그대로 두었어요. 저장하면 이 내용으로 바뀌어요.'}}
  else{const pl=$('#profileLine span');if(pl)pl.textContent='내 프로필: '+P.summary(profile);settingsEntry()}}});
